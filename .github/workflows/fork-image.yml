name: Fork Image Build

# Fork-only workflow: builds the regular LibreChat image (Dockerfile, target `node`)
# for linux/amd64 and pushes it to GHCR only, with the built-in GITHUB_TOKEN.
# Mirrors the build inputs of dev-images.yml / docker-publish.yml without Docker Hub.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Same filters as dev-images.yml: docs-only and .claude changes build nothing.
    paths:
      - 'api/**'
      - 'client/**'
      - 'config/**'
      - 'skill/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'Dockerfile.multi'
      - '.dockerignore'
      - '!**.md'
      - 'skill/**/*.md'
      - '!skill/README.md'

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push librechat (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: cp .env.example .env

      # Registry names must be lowercase, and the repository owner is not guaranteed to be.
      - name: Compute build metadata
        run: |
          set -euo pipefail
          printf 'GHCR_IMAGE=ghcr.io/%s/librechat\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'SHORT_SHA=%s\n' "$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          printf 'BUILD_BRANCH=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          printf 'BUILD_DATE=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: node
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}
            BUILD_DATE=${{ env.BUILD_DATE }}
